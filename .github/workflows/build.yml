name: Build signed Open APKs (ARM64 and ARMv7)

on:
  push:
    branches:
      - build/validate-deekseep-gradle-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK Platform 37.0 and Build Tools 37.0.0
        run: |
          sdkmanager --list --include_obsolete | tee sdk-packages.txt
          grep -F "platforms;android-37.0" sdk-packages.txt
          grep -F "build-tools;37.0.0" sdk-packages.txt
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify installed Android SDK packages
        run: |
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.2"

      - name: Decode and validate official release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64 Actions secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS Actions secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD Actions secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD Actions secret"; exit 1; }
          KEYSTORE_PATH="$RUNNER_TEMP/yunseek-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "DSH_SIGNING_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "DSH_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DSH_SIGNING_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DSH_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Open Release APKs for ARM64 and ARMv7
        working-directory: compose-launcher
        run: |
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/37.0.0/aapt2" \
            :app:assembleRelease

      - name: Verify both APKs, package metadata, ABI split and official signature
        shell: bash
        working-directory: compose-launcher
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$OUT" -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -eq 2
          mkdir -p "$OUT/validated"
          for APK in "${APKS[@]}"; do
            NAME=$(basename "$APK")
            BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
            echo "$BADGING"
            echo "$BADGING" | grep -F "package: name='com.dsmod.probe' versionCode='37' versionName='1.8.1'"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
            case "$NAME" in
              *arm64-v8a*) ABI="arm64-v8a" ;;
              *armeabi-v7a*) ABI="armeabi-v7a" ;;
              *) echo "::error::Unexpected ABI APK filename: $NAME"; exit 1 ;;
            esac
            cp "$APK" "$OUT/validated/YunSeek-1.8.1-$ABI-release-signed.apk"
          done
          (cd "$OUT/validated" && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh "$OUT/validated"

      - name: Upload ARM64 signed APK
        uses: actions/upload-artifact@v7
        with:
          name: YunSeek-1.8.1-arm64-v8a-release-signed
          path: |
            compose-launcher/app/build/outputs/apk/release/validated/YunSeek-1.8.1-arm64-v8a-release-signed.apk
            compose-launcher/app/build/outputs/apk/release/validated/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 signed APK
        uses: actions/upload-artifact@v7
        with:
          name: YunSeek-1.8.1-armeabi-v7a-release-signed
          path: |
            compose-launcher/app/build/outputs/apk/release/validated/YunSeek-1.8.1-armeabi-v7a-release-signed.apk
            compose-launcher/app/build/outputs/apk/release/validated/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
