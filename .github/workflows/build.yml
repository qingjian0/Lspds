name: Build YunSeek 1.8.1 Open edition

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Open edition APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Prepare local debug signing key
        run: |
          mkdir -p module
          keytool -genkeypair -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build Open edition with the repository Gradle project
        working-directory: compose-launcher
        run: |
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            :app:assembleDebug

      - name: Verify APK output
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | \
            grep -F "package: name='com.dsmod.probe' versionCode='37' versionName='1.8.1'"
          mkdir -p dist
          cp "$APK" dist/YunSeek-1.8.1-Lspds-debug.apk
          sha256sum dist/YunSeek-1.8.1-Lspds-debug.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload debug validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: YunSeek-1.8.1-Lspds-debug-validation
          path: dist/
          if-no-files-found: error
          retention-days: 14
