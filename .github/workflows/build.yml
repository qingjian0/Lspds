name: Validate Deekseep-Custom Gradle build

on:
  push:
    branches:
      - build/validate-deekseep-gradle-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-open-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 SDK Platform 37.0 and Build Tools 37.0.0
        run: |
          sdkmanager --list --include_obsolete | tee sdk-packages.txt
          grep -F "platforms;android-37.0" sdk-packages.txt
          grep -F "build-tools;37.0.0" sdk-packages.txt
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Verify installed Android SDK packages
        run: |
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          ls -l "$ANDROID_HOME/platforms/android-37.0/android.jar"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" version

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.8.2"

      - name: Prepare local debug signing key
        run: |
          mkdir -p module
          keytool -genkeypair -v \
            -keystore module/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build Open debug APK using the documented Gradle project task
        working-directory: compose-launcher
        run: |
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/37.0.0/aapt2" \
            :app:assembleDebug

      - name: Verify APK package and version
        working-directory: compose-launcher
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.dsmod.probe' versionCode='37' versionName='1.8.1'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v7
        with:
          name: YunSeek-1.8.1-open-debug-validation
          path: |
            compose-launcher/app/build/outputs/apk/debug/app-debug.apk
            compose-launcher/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
