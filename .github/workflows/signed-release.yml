name: Build and publish signed YunSeek

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-yunseek-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Open edition and sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing KEY_ALIAS"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing KEY_PASSWORD"; exit 1; }

      - name: Restore signing keystore outside workspace
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/yunseek-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null
          keytool -certreq -keystore "$KEYSTORE" \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/yunseek-key-check.csr" >/dev/null
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        working-directory: compose-launcher
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -PprotectedBuild=false \
            -PlocalApiIncluded=false \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            :app:assembleRelease

      - name: Verify APK identity, LSPosed metadata and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="compose-launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.dsmod.probe' versionCode='37' versionName='1.8.1'"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'xposedmodule'
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL_CERT="$(awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' "$RUNNER_TEMP/apk-signature.txt" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="216d2d14d71cdcb818c1a36c723f81bf70dce9cf4ceca018d1444cba027f38e"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT" || {
            echo "::error::APK signing certificate does not match the configured guc325 certificate"
            exit 1
          }
          mkdir -p dist
          cp "$APK" dist/YunSeek-1.8.1-Lspds-signed.apk
          sha256sum dist/YunSeek-1.8.1-Lspds-signed.apk > dist/SHA256SUMS.txt
          cat > dist/BUILD-INFO.txt <<EOF
          Project: qingjian0/Lspds
          Source: YunSeek 1.8.1 Open edition
          Package: com.dsmod.probe
          Version: 1.8.1 (versionCode 37)
          Signing certificate SHA-256: $EXPECTED_CERT
          Build commit: $GITHUB_SHA
          Host compatibility: DeepSeek 2.7.1 code 287; 2.7.2 codes 289/290 are sandbox-mapping validated, not fully real-device validated.
          EOF
          cat dist/SHA256SUMS.txt
          cat dist/BUILD-INFO.txt

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: YunSeek-1.8.1-Lspds-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lspds-v1.8.1-signed
          name: YunSeek 1.8.1 - Lspds signed build
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          generate_release_notes: false
          body: |
            首个由 qingjian0/Lspds 工作流生成并使用维护者签名密钥签名的 YunSeek 1.8.1 Open APK。

            - 包名：com.dsmod.probe
            - versionCode：37
            - LSPosed / Xposed 模块，作用域及功能以 APK 内置配置为准。
            - 国内版 DeepSeek 2.7.1（code 287）为当前适配基线。
            - DeepSeek 2.7.2（code 289/290）目前仅完成沙盒映射校验，尚未全面真机验证。
            - 本构建为 Open edition，不包含 Closed-only / Local API 载荷。
            - 安装前请确认旧版本签名一致；如系统提示签名冲突，不要清除数据覆盖安装。
            - 请核对随附 SHA256SUMS.txt。
          files: |
            dist/YunSeek-1.8.1-Lspds-signed.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
